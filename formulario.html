<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AMB BARBERS | Reservá tu turno</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<style>
  .form-shell{max-width:560px;margin:0 auto;padding:56px 24px 80px;position:relative;z-index:1;overflow:hidden}
  .form-shell h1{font-size:44px;margin-bottom:6px}
  .form-shell .eyebrow{color:var(--accent);letter-spacing:.2em;text-transform:uppercase;font-size:12px;margin-bottom:14px}
  fieldset{border:0;margin-bottom:26px}
  label{display:block;font-size:13px;letter-spacing:.05em;text-transform:uppercase;color:var(--fg-dim);margin-bottom:8px}
  input,select{
    width:100%;background:var(--panel);border:1px solid var(--line);color:var(--fg);
    padding:14px 16px;border-radius:var(--radius);font-family:'Work Sans',sans-serif;font-size:15px;
  }
  input:focus,select:focus{outline:none;border-color:var(--accent)}
  .barber-pick{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .barber-pick label.opt{
    border:1px solid var(--line);border-radius:var(--radius);padding:16px 12px;text-align:center;cursor:pointer;
    text-transform:none;letter-spacing:0;font-size:15px;color:var(--fg);display:flex;flex-direction:column;align-items:center;gap:6px;
    transition:border-color .15s;
  }
  .barber-pick input{position:absolute;opacity:0;width:0;height:0}
  .opt-avatar{
    width:76px;height:76px;border-radius:50%;overflow:hidden;
    border:2px solid var(--line-strong);margin-bottom:4px;
    display:flex;align-items:center;justify-content:center;
    background:var(--panel-2);
  }
  .opt-avatar img{width:100%;height:100%;object-fit:cover;display:block}
  .opt-avatar .initial{font-family:'Bebas Neue',sans-serif;font-size:28px;color:var(--fg-dim)}
  .opt-name{font-family:'Bebas Neue',sans-serif;font-size:20px;letter-spacing:.04em}
  .opt-sub{color:var(--fg-dim);font-size:11px;letter-spacing:.05em;line-height:1.4}
  .opt-check{display:none;color:var(--fg);font-size:13px;margin-top:4px}
  .barber-pick input:checked ~ .opt-check{display:block}
  .barber-pick label.opt:has(input:checked){border-color:var(--fg)}
  #status{margin-top:20px;font-size:14px;color:var(--fg-dim)}
  #status.ok{color:#8fbf7a}
  #status.err{color:#c96a5a}
  button[type=submit]{width:100%;border:0;cursor:pointer;font-family:inherit}
  .post-actions{margin-top:24px;display:flex;flex-direction:column;gap:12px}
  .btn-instagram{
    background:linear-gradient(90deg,#8a2fc9,#e0327a,#f7823a);
    color:#fff;font-weight:600;gap:10px;
  }
  .btn-outline{width:100%}

  .time-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
  .time-pill{
    background:var(--panel);border:1px solid var(--line);color:var(--fg);
    padding:14px 8px;border-radius:var(--radius);font-family:'Work Sans',sans-serif;font-size:14px;font-weight:600;
    cursor:pointer;text-align:center;transition:border-color .15s,background .15s;
  }
  .time-pill:hover{border-color:var(--line-strong)}
  .time-pill.selected{background:var(--fg);color:var(--bg);border-color:var(--fg)}
  .time-pill.disabled{opacity:.35;pointer-events:none}
  .time-empty{color:var(--fg-dim);font-size:14px;grid-column:1/-1}
</style>
</head>
<body>

<header>
  <div class="nav wrap">
    <a href="index.html" class="brand" id="brand-link">
      <img src="assets/logo-a-mark.jpeg" alt="AMB BARBERS">
      <span>AMB BARBERS</span>
    </a>
  </div>
</header>
<div class="stripe"></div>

<div class="site-bg-mark"><img src="assets/logo-amb-barbers-watermark.jpg" alt=""></div>
<div class="form-shell">
  <div class="eyebrow">Reserva online</div>
  <h1>Reservá tu turno</h1>
  <p style="color:var(--fg-dim);margin-bottom:36px">Completá tus datos y te confirmamos por WhatsApp al instante, sin esperas.</p>

  <form id="reserva-form" class="glass form-panel">
    <fieldset>
      <label for="nombre">Nombre y apellido</label>
      <input type="text" id="nombre" name="nombre" required placeholder="Juan Pérez">
    </fieldset>

    <fieldset>
      <label for="whatsapp">Tu WhatsApp</label>
      <input type="tel" id="whatsapp" name="whatsapp" required placeholder="264 xxx xxxx">
    </fieldset>

    <fieldset>
      <label>Barbero</label>
      <div class="barber-pick" id="barber-pick"></div>
    </fieldset>

    <fieldset>
      <label for="servicio">Servicio</label>
      <select id="servicio" name="servicio" required>
        <option value="" disabled selected>Elegí un servicio</option>
      </select>
    </fieldset>

    <fieldset>
      <label for="dia">Día</label>
      <input type="date" id="dia" name="dia" required>
    </fieldset>

    <fieldset>
      <label>Seleccioná un horario</label>
      <input type="hidden" id="horario" name="horario">
      <div class="time-grid" id="horario-pick">
        <span class="time-empty">Elegí un día primero</span>
      </div>
    </fieldset>

    <button type="submit" class="btn btn-primary">Confirmar reserva</button>
    <div id="status"></div>
  </form>

  <div class="post-actions">
    <a class="btn btn-instagram" href="https://www.instagram.com/amb_barber_vip" target="_blank" rel="noopener">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" style="flex-shrink:0">
        <rect x="2" y="2" width="20" height="20" rx="6" stroke="white" stroke-width="2"/>
        <circle cx="12" cy="12" r="4.5" stroke="white" stroke-width="2"/>
        <circle cx="17.5" cy="6.5" r="1.2" fill="white"/>
      </svg>
      Seguinos en Instagram
    </a>
    <a class="btn btn-outline" href="index.html">Volver al inicio</a>
  </div>
</div>

<script src="data.js"></script>
<script>
  // Barberos
  const FOTOS_BARBEROS = {
    sebastian: 'assets/barbero-sebastian.jpeg',
    ale: 'assets/barbero-ale.jpeg',
  };
  const barberPick = document.getElementById('barber-pick');
  BARBEROS.forEach(b=>{
    const l = document.createElement('label');
    l.className='opt';
    const foto = FOTOS_BARBEROS[b.id];
    const avatar = foto
      ? `<img src="${foto}" alt="${b.nombre}">`
      : `<span class="initial">${b.nombre.charAt(0)}</span>`;
    l.innerHTML = `
      <input type="radio" name="barbero" value="${b.id}" required>
      <div class="opt-avatar">${avatar}</div>
      <span class="opt-name">${b.nombre.toUpperCase()}</span>
      <span class="opt-sub">AMB BARBERS<br>®</span>
      <span class="opt-check">✓ Seleccionado</span>
    `;
    barberPick.appendChild(l);
  });

  // Servicios
  const servicioSel = document.getElementById('servicio');
  SERVICIOS.forEach(s=>{
    const opt = document.createElement('option');
    opt.value = s.id;
    opt.textContent = `${s.nombre}${s.detalle ? ' - '+s.detalle : ''} (${s.precio})`;
    servicioSel.appendChild(opt);
  });

  // Horarios disponibles según franja de atención (cada 1 hora), como botones.
  // Si ya se eligió barbero, se consulta /api/ocupados para tachar los horarios
  // que ese barbero ya tiene tomados ese día.
  const diaInput = document.getElementById('dia');
  const horarioInput = document.getElementById('horario');
  const horarioPick = document.getElementById('horario-pick');

  // Fecha de hoy en formato YYYY-MM-DD usando hora LOCAL (no UTC), para que
  // no salte al día siguiente cuando ya es de noche en Argentina.
  function fechaLocalISO(d) {
    const y = d.getFullYear();
    const m = String(d.getMonth() + 1).padStart(2, '0');
    const dia = String(d.getDate()).padStart(2, '0');
    return `${y}-${m}-${dia}`;
  }
  diaInput.min = fechaLocalISO(new Date());

  // API_URL apunta al endpoint de reserva (ej: https://tu-servidor/api/reservar).
  // Para consultar disponibilidad usamos la misma base, cambiando el endpoint.
  const API_BASE = API_URL.replace(/\/api\/reservar\/?$/, '');

  async function actualizarHorarios() {
    horarioInput.value = '';
    horarioPick.innerHTML = '';

    if (!diaInput.value) {
      horarioPick.innerHTML = '<span class="time-empty">Elegí un día primero</span>';
      return;
    }

    const fecha = new Date(diaInput.value + 'T00:00:00');
    const dow = fecha.getDay();
    const franjasDelDia = HORARIOS_POR_DIA[dow] || [];
    if (franjasDelDia.length === 0) {
      horarioPick.innerHTML = '<span class="time-empty">Cerrado ese día</span>';
      return;
    }

    // Armamos todos los horarios posibles recorriendo cada franja del día
    // (puede haber más de una, ej: turno partido mañana/tarde)
    const horariosPosibles = [];
    franjasDelDia.forEach(({ apertura, cierre }) => {
      const [hIni, mIni] = apertura.split(':').map(Number);
      const [hFin, mFin] = cierre.split(':').map(Number);
      let t = hIni * 60 + mIni;
      const fin = hFin * 60 + mFin;
      while (t < fin) {
        const hh = String(Math.floor(t / 60)).padStart(2, '0');
        const mm = String(t % 60).padStart(2, '0');
        horariosPosibles.push(`${hh}:${mm}`);
        t += 60;
      }
    });

    const barberoSeleccionado = form.barbero.value;

    // Si ya eligió barbero, consultamos qué horarios tiene ocupados ese día
    let ocupados = [];
    if (barberoSeleccionado) {
      horarioPick.innerHTML = '<span class="time-empty">Consultando disponibilidad...</span>';
      try {
        const res = await fetch(`${API_BASE}/api/ocupados?dia=${diaInput.value}&barbero=${barberoSeleccionado}`);
        if (res.ok) {
          const data = await res.json();
          ocupados = data.ocupados || [];
        }
      } catch (e) {
        console.error('No se pudo consultar disponibilidad:', e);
        // Si falla la consulta (por ejemplo sin internet), preferimos mostrar
        // todos los horarios igual antes que trabar la reserva por completo.
        // El backend igual va a rechazar un horario duplicado al confirmar.
      }
      horarioPick.innerHTML = '';
    }

    horariosPosibles.forEach(valor => {
      const ocupado = ocupados.includes(valor);
      const pill = document.createElement('button');
      pill.type = 'button';
      pill.className = 'time-pill' + (ocupado ? ' disabled' : '');
      pill.textContent = ocupado ? `${valor} HS ✕` : `${valor} HS`;
      if (!ocupado) {
        pill.addEventListener('click', () => {
          horarioPick.querySelectorAll('.time-pill').forEach(p => p.classList.remove('selected'));
          pill.classList.add('selected');
          horarioInput.value = valor;
        });
      }
      horarioPick.appendChild(pill);
    });

    if (barberoSeleccionado && horariosPosibles.every(h => ocupados.includes(h))) {
      horarioPick.innerHTML = '<span class="time-empty">No quedan horarios disponibles con este barbero ese día. Probá otro día o el otro barbero.</span>';
    }
  }

  diaInput.addEventListener('change', actualizarHorarios);
  // Los radios de barbero se agregan dinámicamente, pero "change" burbujea,
  // así que escuchar en el contenedor alcanza para detectar cualquier selección.
  barberPick.addEventListener('change', actualizarHorarios);

  // Envío al backend (el bot manda la confirmación automática por WhatsApp)
  const form = document.getElementById('reserva-form');
  const status = document.getElementById('status');

  form.addEventListener('submit', async (e) => {
    e.preventDefault();

    if (!horarioInput.value) {
      status.className='err';
      status.textContent = 'Elegí un horario antes de confirmar.';
      return;
    }

    status.className=''; status.textContent = 'Enviando reserva...';

    const data = {
      nombre: document.getElementById('nombre').value,
      whatsapp: document.getElementById('whatsapp').value,
      barbero: form.barbero.value,
      servicio: servicioSel.value,
      dia: diaInput.value,
      horario: horarioInput.value,
    };

    let res;
    try {
      res = await fetch(API_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(data),
      });
      const respuesta = await res.json().catch(() => ({}));
      if (!res.ok) throw new Error(respuesta.error || 'No se pudo enviar');
      status.className='ok';
      status.textContent = '¡Reserva enviada! Te llega la confirmación por WhatsApp en instantes.';
      form.reset();
      horarioPick.innerHTML = '<span class="time-empty">Elegí un día primero</span>';
    } catch (err) {
      status.className='err';
      status.textContent = err.message || 'Hubo un problema al enviar la reserva. Probá de nuevo o escribinos por WhatsApp.';
      // Si el horario se ocupó justo antes de confirmar (dos personas reservando
      // a la vez), refrescamos la grilla para que ya no aparezca disponible.
      if (res && res.status === 409) actualizarHorarios();
    }
  });

  // Doble clic en el logo → acceso directo al panel de control
  const brandLink = document.getElementById('brand-link');
  if (brandLink) {
    let clickTimer = null;
    brandLink.addEventListener('click', (e) => {
      e.preventDefault();
      if (clickTimer) {
        clearTimeout(clickTimer);
        clickTimer = null;
        window.location.href = 'panel.html';
      } else {
        clickTimer = setTimeout(() => {
          clickTimer = null;
          window.location.href = brandLink.getAttribute('href');
        }, 280);
      }
    });
  }
</script>
</body>
</html>
